<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻宝大冒险 · async/await 异步之旅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #e8c268;
    --gold-bright: #f7dd8f;
    --ember: #ff9a5c;
    --ink: #0a0d16;
    --panel: rgba(16, 21, 34, .88);
    --line: rgba(232, 194, 104, .35);
  }

  html, body { height: 100%; }
  body {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Microsoft YaHei", serif;
    background: #05060c;
    color: #f0e6d2;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== 全局氛围层 ===== */
  .aurora {
    position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40% 55% at 20% 20%, rgba(64, 42, 120, .35), transparent 70%),
      radial-gradient(45% 50% at 80% 15%, rgba(20, 80, 100, .28), transparent 70%),
      radial-gradient(50% 60% at 50% 100%, rgba(120, 70, 20, .22), transparent 70%);
    animation: auroraMove 18s ease-in-out infinite alternate;
  }
  @keyframes auroraMove {
    from { transform: translate3d(-2%, -1%, 0) rotate(-1deg); }
    to   { transform: translate3d(2%, 2%, 0) rotate(1.5deg); }
  }
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%; background: #ffe9a8;
    animation: twinkle var(--d, 3s) infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .12; transform: scale(.7); }
    50% { opacity: .95; transform: scale(1.25); }
  }
  .vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  .container {
    position: relative; z-index: 2;
    max-width: 1080px; margin: 0 auto; padding: 36px 24px 70px;
  }

  /* ===== 标题 ===== */
  header { text-align: center; margin-bottom: 30px; }
  .title-deco { color: var(--gold); font-size: 18px; letter-spacing: 14px; opacity: .8; }
  header h1 {
    font-size: 52px; letter-spacing: 14px; font-weight: 700; margin: 6px 0 4px;
    background: linear-gradient(180deg, #fff3d0 0%, var(--gold-bright) 35%, #b8862e 70%, var(--gold-bright) 100%);
    background-size: 100% 220%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleFlow 5s ease-in-out infinite;
    text-shadow: 0 0 42px rgba(232, 194, 104, .22);
  }
  @keyframes titleFlow {
    0%, 100% { background-position: 50% 0%; }
    50% { background-position: 50% 100%; }
  }
  header p { color: #9db1cc; font-size: 15px; letter-spacing: 4px; }

  /* ===== 舞台 ===== */
  .stage-wrap {
    position: relative; border-radius: 20px; padding: 10px;
    background: linear-gradient(145deg, rgba(232,194,104,.5), rgba(90,60,20,.15) 30%, rgba(232,194,104,.4));
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(232,194,104,.08);
  }
  .stage {
    position: relative; height: 480px; border-radius: 14px;
    overflow: hidden; background: #0a0f1c;
  }
  .scene {
    position: absolute; inset: 0;
    opacity: 0; transform: scale(1.07);
    transition: opacity 1.1s ease, transform 1.6s ease;
    pointer-events: none;
  }
  .scene.active { opacity: 1; transform: scale(1); }
  .scene svg { width: 100%; height: 100%; display: block; }

  .stage::after {
    content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(to top, rgba(5,6,12,.82), transparent 42%);
  }

  /* 探险家 */
  .explorer {
    position: absolute; bottom: 92px; left: 3%; z-index: 4;
    font-size: 46px; line-height: 1;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,.65));
    transition: left 1.6s cubic-bezier(.65,.05,.3,1);
  }
  .explorer.walking { animation: walk .45s infinite ease-in-out; }
  @keyframes walk {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-10px) rotate(6deg); }
  }

  /* 羊皮纸气泡 */
  .bubble {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 6; width: min(760px, 88%);
    background: linear-gradient(180deg, #f5e7c6, #e8d5a8);
    color: #4a3413;
    border: 1px solid #b9975a;
    border-radius: 4px 18px 4px 18px;
    padding: 16px 28px;
    font-size: 19px; line-height: 1.65; text-align: center;
    box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 0 40px rgba(150, 110, 40, .18);
    opacity: 0; translate: 0 8px;
    transition: opacity .5s ease, translate .5s ease;
  }
  .bubble.show { opacity: 1; translate: 0 0; }
  .bubble .cursor {
    display: inline-block; width: 2px; height: 1em;
    background: #7a5a1e; vertical-align: -2px; margin-left: 2px;
    animation: blink .7s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 进度之路 ===== */
  .journey { margin: 34px 8px 6px; position: relative; padding: 0 2%; }
  .journey-track {
    position: absolute; left: 5%; right: 5%; top: 27px; height: 4px;
    border-radius: 3px; background: rgba(157,177,204,.18);
  }
  .journey-fill {
    position: absolute; left: 5%; top: 27px; height: 4px; width: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--gold), var(--ember));
    box-shadow: 0 0 14px rgba(232,194,104,.8);
    transition: width 1.1s ease;
  }
  .journey-nodes { display: flex; justify-content: space-between; position: relative; }
  .jnode { width: 56px; text-align: center; }
  .jnode .ico {
    width: 56px; height: 56px; margin: 0 auto;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 26px; background: #141b2c;
    border: 2px solid rgba(157,177,204,.3);
    transition: all .5s ease;
  }
  .jnode .lbl {
    margin-top: 8px; font-size: 12px; color: #7e90ac; letter-spacing: 1px;
    transition: color .5s ease; white-space: nowrap;
  }
  .jnode.done .ico {
    border-color: var(--gold); background: #2b2210;
    box-shadow: 0 0 16px rgba(232,194,104,.55);
  }
  .jnode.done .lbl { color: var(--gold); }
  .jnode.current .ico {
    border-color: var(--ember); background: #3a2113; transform: scale(1.12);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .jnode.current .lbl { color: var(--ember); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,154,92,.55); }
    50% { box-shadow: 0 0 0 14px rgba(255,154,92,0); }
  }

  /* ===== 下半区：日志 + 控制 ===== */
  .lower { display: flex; gap: 22px; margin-top: 30px; align-items: stretch; }
  .log-panel {
    flex: 1; background: var(--panel); backdrop-filter: blur(6px);
    border: 1px solid rgba(157,177,204,.2); border-radius: 14px;
    padding: 20px 24px; height: 250px; overflow-y: auto;
    font-size: 15px; box-shadow: inset 0 0 40px rgba(0,0,0,.4);
  }
  .log-panel::-webkit-scrollbar { width: 8px; }
  .log-panel::-webkit-scrollbar-thumb { background: #3a4763; border-radius: 4px; }
  .log-title {
    font-size: 13px; letter-spacing: 4px; color: var(--gold);
    border-bottom: 1px solid rgba(232,194,104,.25);
    padding-bottom: 10px; margin-bottom: 10px;
  }
  .log-item {
    padding: 7px 0; border-bottom: 1px dashed rgba(157,177,204,.12);
    animation: slideIn .5s ease both; line-height: 1.5;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .log-time { color: #62738f; margin-right: 10px; font-size: 12px; font-family: Consolas, monospace; }
  .log-item.fail { color: #ff8f8f; }
  .log-item.success { color: #86e6ab; }

  .side {
    width: 220px; display: flex; flex-direction: column; gap: 16px;
    justify-content: center; align-items: center;
  }
  button {
    font-family: inherit; font-size: 19px; letter-spacing: 6px; cursor: pointer;
    padding: 16px 0; width: 100%; border-radius: 50px; border: none;
    color: #2b1d05; font-weight: bold;
    background: linear-gradient(135deg, var(--gold-bright), var(--ember));
    box-shadow: 0 10px 26px rgba(232,194,104,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(232,194,104,.5); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .stat {
    width: 100%; background: var(--panel); border: 1px solid rgba(157,177,204,.18);
    border-radius: 12px; padding: 12px 16px; font-size: 14px; color: #9db1cc;
    text-align: center; line-height: 1.9;
  }
  .stat b { color: var(--gold); font-size: 20px; }

  /* ===== 结局横幅 ===== */
  .banner {
    text-align: center; font-size: 30px; font-weight: bold;
    margin-top: 30px; min-height: 46px; letter-spacing: 6px;
  }
  .banner.win { color: var(--gold-bright); animation: winGlow 1.2s infinite alternate ease-in-out; }
  @keyframes winGlow {
    from { text-shadow: 0 0 12px rgba(232,194,104,.5); }
    to { text-shadow: 0 0 38px rgba(232,194,104,.95), 0 0 80px rgba(255,154,92,.5); }
  }
  .banner.lose { color: #ff8f8f; animation: shake .5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
  }

  /* ===== 金币雨 ===== */
  .coin {
    position: fixed; top: -50px; z-index: 50; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  /* ===== 抉择按钮 ===== */
  .choices {
    position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%);
    z-index: 7; display: none; gap: 16px; flex-wrap: wrap; justify-content: center;
    width: min(820px, 92%);
  }
  .choices.show { display: flex; }
  .choice-btn {
    font-family: inherit; font-size: 17px; letter-spacing: 2px;
    padding: 13px 26px; border-radius: 12px; cursor: pointer;
    color: #f5e7c6; background: rgba(20, 27, 44, .92);
    border: 2px solid var(--gold); width: auto;
    box-shadow: 0 8px 22px rgba(0,0,0,.55), inset 0 0 18px rgba(232,194,104,.08);
    transition: all .25s ease;
    animation: choiceIn .4s ease both;
  }
  .choice-btn:nth-child(2) { animation-delay: .1s; }
  .choice-btn:nth-child(3) { animation-delay: .2s; }
  @keyframes choiceIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .choice-btn:hover {
    background: linear-gradient(135deg, rgba(232,194,104,.25), rgba(255,154,92,.2));
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(232,194,104,.35);
  }
  .choices.locked .choice-btn { pointer-events: none; opacity: .35; }
  .choices.locked .choice-btn.picked {
    opacity: 1; background: linear-gradient(135deg, var(--gold-bright), var(--ember));
    color: #2b1d05; border-color: transparent; font-weight: bold;
  }

  /* ===== SVG 场景内动画 ===== */
  .flicker { animation: flicker 1.6s infinite ease-in-out; transform-origin: center bottom; }
  @keyframes flicker {
    0%, 100% { opacity: .85; transform: scaleY(1); }
    25% { opacity: 1; transform: scaleY(1.12) scaleX(.96); }
    55% { opacity: .7; transform: scaleY(.9); }
    80% { opacity: .95; transform: scaleY(1.06); }
  }
  .glowPulse { animation: glowPulse 2.4s infinite ease-in-out; }
  @keyframes glowPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .floatY { animation: floatY 4s infinite ease-in-out; }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }
  .floatY2 { animation: floatY 5.5s infinite ease-in-out reverse; }
  .firefly { animation: firefly var(--fd, 6s) infinite ease-in-out; }
  @keyframes firefly {
    0%, 100% { opacity: .1; transform: translate(0, 0); }
    25% { opacity: 1; }
    50% { opacity: .3; transform: translate(24px, -30px); }
    75% { opacity: .9; }
  }
  .fogDrift { animation: fogDrift 14s infinite ease-in-out alternate; }
  @keyframes fogDrift {
    from { transform: translateX(-60px); }
    to { transform: translateX(60px); }
  }
  .shaft { animation: shaft 5s infinite ease-in-out; }
  @keyframes shaft { 0%, 100% { opacity: .18; } 50% { opacity: .42; } }
  .rise { animation: rise var(--rd, 3s) infinite linear; }
  @keyframes rise {
    from { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    to { transform: translateY(-140px); opacity: 0; }
  }
  .runeGlow { animation: runeGlow 2s infinite ease-in-out; }
  @keyframes runeGlow {
    0%, 100% { opacity: .5; filter: drop-shadow(0 0 4px #ffb347); }
    50% { opacity: 1; filter: drop-shadow(0 0 14px #ffb347); }
  }
  .eyeGlow { animation: glowPulse 1.8s infinite ease-in-out; }

  @media (max-width: 760px) {
    header h1 { font-size: 34px; letter-spacing: 8px; }
    .stage { height: 340px; }
    .lower { flex-direction: column; }
    .side { width: 100%; flex-direction: row; }
    .jnode .lbl { display: none; }
  }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="stars" id="stars"></div>
<div class="vignette"></div>

<div class="container">
  <header>
    <div class="title-deco">— ⚔ —</div>
    <h1>寻宝大冒险</h1>
    <p>async / await · 八 幕 异 步 奇 遇</p>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <!-- 场景 SVG 由 JS 注入 -->
      <div class="explorer walking" id="explorer">🧝</div>
      <div class="choices" id="choices"></div>
      <div class="bubble show" id="bubble"><span id="bubbleText">点击「启程寻宝」，一段异步的奇遇即将展开……你的每个抉择都将决定命运!</span><span class="cursor"></span></div>
    </div>
  </div>

  <div class="journey">
    <div class="journey-track"></div>
    <div class="journey-fill" id="journeyFill"></div>
    <div class="journey-nodes" id="journeyNodes"></div>
  </div>

  <div class="lower">
    <div class="log-panel" id="logPanel">
      <div class="log-title">冒 险 日 志</div>
      <div class="log-item"><span class="log-time">[系统]</span>欢迎来到寻宝大冒险，点击右侧按钮启程。</div>
    </div>
    <div class="side">
      <button id="startBtn">启程寻宝</button>
      <div class="stat">冒险次数<br><b id="statCount">0</b></div>
    </div>
  </div>

  <div class="banner" id="banner"></div>
</div>

<script src="treasure.js"></script>
<script>
/* ============================================================
 * 八幕手绘 SVG 场景（无外部图片，永不加载失败）
 * ============================================================ */
const SCENES = [

/* 0 · 古老图书馆 */
`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="libBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141018"/><stop offset="100%" stop-color="#241a12"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#libBg)"/>
  ${[-3,-2,-1,1,2,3].map(i=>`
    <g transform="translate(${800+i*240},0)">
      <rect x="-95" y="60" width="190" height="700" fill="#2b1e12" stroke="#191008" stroke-width="6"/>
      ${[0,1,2,3,4,5].map(r=>`<rect x="-80" y="${95+r*112}" width="160" height="14" fill="#1c1209"/>
        ${[0,1,2,3,4,5,6].map(c=>`<rect x="${-74+c*22}" y="${48+r*112}" width="16" height="${44+((r*7+c*13)%14)}" rx="2" fill="hsl(${(r*47+c*61+i*30)%360},38%,${26+((r+c)%3)*8}%)"/>`).join("")}
      `).join("")}
    </g>`).join("")}
  <rect x="0" y="760" width="1600" height="140" fill="#17100a"/>
  <ellipse cx="800" cy="860" rx="700" ry="60" fill="#000" opacity=".4"/>
  <g transform="translate(800,700)">
    <rect x="-260" y="0" width="520" height="34" rx="6" fill="#4a3319"/>
    <rect x="-240" y="34" width="28" height="130" fill="#3a2712"/>
    <rect x="212" y="34" width="28" height="130" fill="#3a2712"/>
    <path d="M-150,-6 Q-60,-34 30,-10 Q130,10 160,-8 L160,8 Q90,26 -20,10 Q-110,-2 -150,8 Z" fill="#e8d5a8" stroke="#b9975a" stroke-width="3"/>
    <path d="M-120,-2 Q-40,-18 60,-4" stroke="#8a6a34" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <circle cx="96" cy="0" r="10" fill="#c0392b"/>
  </g>
  <g transform="translate(560,640)">
    <circle r="120" fill="url(#candleGlow)" class="glowPulse"/>
    <rect x="-8" y="0" width="16" height="46" fill="#e8dcc0"/>
    <ellipse class="flicker" cx="0" cy="-14" rx="10" ry="20" fill="#ffb347"/>
    <ellipse class="flicker" cx="0" cy="-10" rx="5" ry="10" fill="#fff3c0"/>
  </g>
  <g transform="translate(1040,648)">
    <circle r="110" fill="url(#candleGlow)" class="glowPulse" style="animation-delay:1.1s"/>
    <rect x="-8" y="0" width="16" height="40" fill="#e8dcc0"/>
    <ellipse class="flicker" cx="0" cy="-13" rx="9" ry="18" fill="#ffb347" style="animation-delay:.4s"/>
    <ellipse class="flicker" cx="0" cy="-9" rx="4" ry="9" fill="#fff3c0"/>
  </g>
</svg>`,

/* 1 · 符文解码 */
`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="runeBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a1b4a"/><stop offset="100%" stop-color="#0c081a"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#runeBg)"/>
  <g transform="translate(800,480)">
    <ellipse rx="430" ry="130" fill="#1b1030" stroke="#4a3a7a" stroke-width="4"/>
    <path d="M-330,0 Q-200,-70 0,-58 Q220,-70 330,0 Q200,58 0,52 Q-210,60 -330,0 Z" fill="#efe3c0" opacity=".92"/>
    <path d="M-260,-6 Q-120,-34 30,-22 M-270,10 Q-100,-8 90,4 M-220,24 Q-60,8 150,16" stroke="#7a5f9f" stroke-width="5" fill="none" opacity=".8"/>
  </g>
  ${["ᚠ","ᚱ","ᚨ","ᛞ","ᛟ","ᚾ","ᛗ","ᚺ","ᛁ","ᛏ","ᛒ","ᛊ"].map((r,i)=>{
    const a = i/12*Math.PI*2, x = 800+Math.cos(a)*470, y = 400+Math.sin(a)*250;
    return `<text x="${x}" y="${y}" text-anchor="middle" font-size="64" fill="#9d7bff" class="floatY${i%2?"":"2"} runeGlow" style="animation-delay:${i*.3}s">${r}</text>`;
  }).join("")}
  <circle cx="800" cy="430" r="180" fill="none" stroke="#6a4fd0" stroke-width="3" opacity=".5" class="glowPulse"/>
  <circle cx="800" cy="430" r="240" fill="none" stroke="#6a4fd0" stroke-width="2" stroke-dasharray="14 20" opacity=".4" class="glowPulse" style="animation-delay:.9s"/>
</svg>`,

/* 2 · 篝火夜会 */
`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1030"/><stop offset="100%" stop-color="#1c2340"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#nightSky)"/>
  ${Array.from({length:40},(_,i)=>`<circle cx="${(i*137)%1600}" cy="${(i*89)%380}" r="${1+(i%3)}" fill="#ffe9a8" opacity="${.3+(i%5)*.14}"/>`).join("")}
  <circle cx="1330" cy="130" r="66" fill="#f5eed6"/><circle cx="1310" cy="118" r="58" fill="#0a1030" opacity=".28"/>
  ${[80,260,1420,1560,560].map((x,i)=>`<path d="M${x},820 L${x+60},${420+(i%3)*70} L${x+120},820 Z" fill="#0b1226"/>`).join("")}
  <rect x="0" y="800" width="1600" height="100" fill="#0c1526"/>
  <ellipse cx="800" cy="760" rx="560" ry="150" fill="url(#fireGlow)" class="glowPulse"/>
  <g transform="translate(800,780)">

const STEPS = [
  { ico: "📚", lbl: "图书馆" }, { ico: "🔮", lbl: "解码" },
  { ico: "🤝", lbl: "集结" },   { ico: "🌫️", lbl: "沼泽" },
  { ico: "🚪", lbl: "石门" },   { ico: "🏛️", lbl: "神庙" },
  { ico: "🐉", lbl: "巨龙" },   { ico: "💎", lbl: "宝藏" },
];

/* ============================================================
 * DOM 初始化
 * ============================================================ */
const stage = document.getElementById("stage");
const explorer = document.getElementById("explorer");
const bubble = document.getElementById("bubble");
const bubbleText = document.getElementById("bubbleText");
const logPanel = document.getElementById("logPanel");
const banner = document.getElementById("banner");
const startBtn = document.getElementById("startBtn");
const journeyFill = document.getElementById("journeyFill");
const journeyNodes = document.getElementById("journeyNodes");
const statCount = document.getElementById("statCount");
const choicesBox = document.getElementById("choices");

// 注入场景
SCENES.forEach((svg, i) => {
  const div = document.createElement("div");
  div.className = "scene";
  div.dataset.step = i;
  div.innerHTML = svg;
  stage.insertBefore(div, explorer);
});

// 注入进度节点
STEPS.forEach((s, i) => {
  const n = document.createElement("div");
  n.className = "jnode";
  n.dataset.step = i;
  n.innerHTML = `<div class="ico">${s.ico}</div><div class="lbl">${s.lbl}</div>`;
  journeyNodes.appendChild(n);
});
const jnodes = document.querySelectorAll(".jnode");

// 星空
const starsBox = document.getElementById("stars");
for (let i = 0; i < 80; i++) {
  const s = document.createElement("div");
  s.className = "star";
  const size = 1 + Math.random() * 2.6;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
  starsBox.appendChild(s);
}

/* ============================================================
 * 动画驱动
 * ============================================================ */
let typeTimer = null;
function showBubble(text) {
  clearInterval(typeTimer);
  bubble.classList.add("show");
  bubbleText.textContent = "";
  let i = 0;
  typeTimer = setInterval(() => {
    bubbleText.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(typeTimer);
  }, 42);
}

function activateStep(step) {
  document.querySelectorAll(".scene").forEach(s =>
    s.classList.toggle("active", +s.dataset.step === step));
  jnodes.forEach(n => {
    const idx = +n.dataset.step;
    n.classList.toggle("done", idx < step);
    n.classList.toggle("current", idx === step);
  });
  journeyFill.style.width = (step / (STEPS.length - 1)) * 90 + "%";
  explorer.style.left = 3 + (step / (STEPS.length - 1)) * 82 + "%";
  // 换场景时小人走两步
  explorer.classList.add("walking");
  setTimeout(() => explorer.classList.remove("walking"), 1600);
}

function detectStep(text) {
  if (/图书馆|第一个线索/.test(text)) return 0;
  if (/解码/.test(text)) return 1;
  if (/伙伴|加入/.test(text)) return 2;
  if (/沼泽/.test(text)) return 3;
  if (/石门/.test(text)) return 4;
  if (/神庙|箱子/.test(text)) return 5;
  if (/巨龙/.test(text)) return 6;
  if (/宝藏/.test(text)) return 7;
  return -1;
}

function gameLog(text) {
  const item = document.createElement("div");
  item.className = "log-item";
  if (/失败|糟糕|激怒|撤退|错误/.test(text)) item.classList.add("fail");
  if (/恭喜|宝藏/.test(text)) item.classList.add("success");
  const t = new Date().toTimeString().slice(0, 8);
  item.innerHTML = `<span class="log-time">[${t}]</span>${text}`;
  logPanel.appendChild(item);
  logPanel.scrollTop = logPanel.scrollHeight;

  const step = detectStep(text);
  if (step >= 0) {
    activateStep(step);
    showBubble(text.replace(/^[^\s]+\s/, ""));
  } else {
    showBubble(text);
  }
}

// 玩家抉择：展示问题与选项按钮，返回 Promise<选项下标>
function gameAsk(question, options) {
  return new Promise((resolve) => {
    // 问题里含场景关键词，借此切换到对应场景
    const step = detectStep(question);
    if (step >= 0) activateStep(step);
    showBubble(question);

    choicesBox.innerHTML = "";
    choicesBox.className = "choices show";
    options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        choicesBox.classList.add("locked");
        btn.classList.add("picked");
        setTimeout(() => {
          choicesBox.className = "choices";
          choicesBox.innerHTML = "";
          resolve(i);
        }, 650);
      });
      choicesBox.appendChild(btn);
    });
  });
}

function coinRain() {
  const icons = ["🪙", "💰", "✨", "💎", "👑"];
  for (let i = 0; i < 46; i++) {
    setTimeout(() => {
      const c = document.createElement("div");
      c.className = "coin";
      c.textContent = icons[Math.floor(Math.random() * icons.length)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.fontSize = 20 + Math.random() * 22 + "px";
      c.style.animationDuration = 2 + Math.random() * 2.2 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }, i * 110);
  }
}

function reset() {
  jnodes.forEach(n => n.classList.remove("done", "current"));
  journeyFill.style.width = "0";
  explorer.style.left = "3%";
  banner.textContent = "";
  banner.className = "banner";
  choicesBox.className = "choices";
  choicesBox.innerHTML = "";
  logPanel.innerHTML = '<div class="log-title">冒 险 日 志</div>';
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
}

let runs = 0;
startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  reset();
  statCount.textContent = ++runs;
  gameLog("🎬 第 " + runs + " 次冒险，启程!");
  const result = await findTreasureWithAsyncAwait(gameLog, gameAsk);
  jnodes.forEach(n => n.classList.remove("current"));
  if (result.success) {
    jnodes.forEach(n => n.classList.add("done"));
    journeyFill.style.width = "90%";
    banner.textContent = "🏆 寻宝成功!传说中的宝藏属于你!";
    banner.classList.add("win");
    coinRain();
  } else {
    banner.textContent = "💀 冒险失败……振作起来，再次启程吧!";
    banner.classList.add("lose");
  }
  startBtn.disabled = false;
  startBtn.textContent = "再次寻宝";
});
</script>
